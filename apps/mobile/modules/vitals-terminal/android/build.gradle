plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vitalsterminal'
version = '1.0.0'

android {
  namespace "expo.modules.vitalsterminal"
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    def architectures = project.findProperty('reactNativeArchitectures')
    if (architectures) {
      ndk {
        abiFilters(*architectures.split(','))
      }
    }
    externalNativeBuild {
      cmake {
        cppFlags '-std=c++17 -Wall -Wextra -Werror'
      }
    }
  }
  externalNativeBuild {
    cmake {
      path 'src/main/cpp/CMakeLists.txt'
      version '3.22.1'
    }
  }
}
