plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vitalstailnet'
version = '1.0.0'

android {
  namespace "expo.modules.vitalstailnet"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  implementation files('libs/tailnet.jar')
}
