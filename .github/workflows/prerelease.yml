name: Pre-release (Dev)

# The Dev channel's feed. Every push to a non-main branch builds the Dev app
# and publishes TWO GitHub *pre-releases* carrying Vitals-Dev.dmg:
#   1. a per-branch tag (dev-<branch>) — install a specific branch's build
#   2. a rolling `dev` tag — always the newest Dev build; the stable download URL
#      the Homebrew cask (rafay99-epic/apps/vitals-dev) points at.
# The Dev app's updater tracks the newest pre-release. Stable (main →
# ci.yml's release job) is untouched.
#
# Gated by tests: a broken branch publishes nothing.
on:
  push:
    branches-ignore: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/prerelease.yml"
  workflow_dispatch:

permissions:
  contents: write

# One in-flight build per branch; a newer push supersedes an older one.
concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/desktop

jobs:
  test:
    name: Test before pre-release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Run tests
        run: swift test
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint --reporter github-actions-logging

  prerelease:
    name: Build and publish Dev pre-release
    runs-on: macos-26
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history — the version is the commit count

      - name: Compute identity
        run: |
          echo "VERSION=0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          # Tag is per-branch; slashes aren't tag-friendly.
          echo "TAG=dev-$(echo "${GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Build Dev app and installer
        run: |
          export VITALS_CHANNEL=dev
          export VITALS_VERSION="$VERSION"
          export VITALS_BUILD="$BUILD"
          ./make-dmg.sh

      - name: Publish per-branch pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace the branch's previous pre-release so the tag follows HEAD.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          # The title MUST contain "build <n>" — the updater parses it to order builds.
          gh release create "$TAG" build/Vitals-Dev.dmg \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Vitals Dev · $BRANCH · build $BUILD" \
            --notes "Dev build of branch \`$BRANCH\` @ \`$SHA\` (build $BUILD, version $VERSION-dev).

          **Install:** download \`Vitals-Dev.dmg\` below and drag to Applications. It installs as **Vitals Dev** — separate app, settings, and icon — so it sits next to a Stable install without touching it. Dev auto-updates to the newest pre-release.

          ⚠️ Unsigned pre-release build for testing. Right-click → Open the first time to get past Gatekeeper."

      - name: Update rolling "latest Dev" pre-release (for the Homebrew cask)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A single fixed `dev` tag that always holds the newest Dev DMG — GitHub
          # has no /latest/ download URL for pre-releases, so the Homebrew cask
          # (rafay99-epic/apps/vitals-dev) and anyone wanting "the latest Dev"
          # need this stable pointer. Updated on every branch's build.
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          gh release create dev build/Vitals-Dev.dmg \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Vitals Dev (latest) · build $BUILD" \
            --notes "The newest Dev build — from branch \`$BRANCH\` @ \`$SHA\` (build $BUILD, version $VERSION-dev).

          **Install:** \`brew install --cask rafay99-epic/apps/vitals-dev\`

          Installs as **Vitals Dev** alongside a Stable copy (separate app, icon, and settings) and auto-updates from this feed. Unsigned pre-release build."
