name: Linux

# Linux-app CI. Separate from the macOS workflows (ci.yml / release.yml) and
# triggered only on its own paths — a change anywhere else skips this entirely,
# keeping the pipeline clean. The Linux app has no updater and publishes no
# GitHub Release; it uploads the AppImage as a workflow artifact for download.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop-linux/**"
      - ".github/workflows/linux.yml"
  pull_request:
    paths:
      - "apps/desktop-linux/**"
      - ".github/workflows/linux.yml"

defaults:
  run:
    working-directory: apps/desktop-linux

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # Build natively on each architecture — a foreign-arch ELF can't execute, so
    # ARM users need a real aarch64 AppImage, not the x86_64 one. GitHub's ARM
    # Linux runners are free for public repos. The swift:6.0-noble image is
    # multi-arch, so the same tag pulls the matching arch on each runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v6

      - name: Install GTK4 + libadwaita + cairo (build) and packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev libadwaita-1-dev libcairo2-dev libglib2.0-dev \
            curl file patchelf desktop-file-utils zsync dpkg-dev \
            librsvg2-bin librsvg2-common libglib2.0-bin libgdk-pixbuf2.0-bin

      - name: Swift version
        run: swift --version

      - name: Unit tests (VitalsCore parsers)
        run: swift test

      - name: Build release
        run: swift build -c release

      - name: Build AppImage
        run: ./make-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Vitals-linux-${{ matrix.arch }}-AppImage
          path: apps/desktop-linux/build/Vitals-${{ matrix.arch }}.AppImage
          retention-days: 90
          if-no-files-found: error
