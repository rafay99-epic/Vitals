name: Linux

# Linux-app CI. Separate from the macOS workflows (ci.yml / release.yml) and
# triggered only on its own paths — a change anywhere else skips this entirely,
# keeping the pipeline clean. The Linux app has no updater and publishes no
# GitHub Release; it uploads the AppImage as a workflow artifact for download.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop-linux/**"
      - ".github/workflows/linux.yml"
  pull_request:
    paths:
      - "apps/desktop-linux/**"
      - ".github/workflows/linux.yml"

defaults:
  run:
    working-directory: apps/desktop-linux

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    # Official Swift image; matches apps/desktop-linux/Dockerfile.
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v6

      - name: Install GTK4 + libadwaita + cairo (build) and packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev libadwaita-1-dev libcairo2-dev \
            curl file patchelf desktop-file-utils zsync \
            librsvg2-bin librsvg2-common libglib2.0-bin libgdk-pixbuf2.0-bin

      - name: Swift version
        run: swift --version

      - name: Unit tests (VitalsCore parsers)
        run: swift test

      - name: Build release
        run: swift build -c release

      - name: Build AppImage
        run: ./make-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Vitals-linux-AppImage
          path: apps/desktop-linux/build/Vitals-x86_64.AppImage
          retention-days: 90
          if-no-files-found: error
