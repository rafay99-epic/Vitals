name: CI

# Desktop-app CI **and** release, in one pipeline so the build users receive is
# the exact one that passed every check. Test + lint are the gate: on `main` the
# release builds + publishes only after both pass; on PRs the DMG builds +
# uploads as an artifact instead. The release-config compile happens inside those
# build steps (build.sh), so there's no separate build job recompiling the same
# thing on its own runner. The website has its own workflow (website.yml); each
# app triggers only on its own paths.
#
# Why one workflow and not a separate Release workflow: two independent workflows
# each run their own `swift test`, and a flaky test can pass in one while failing
# the other — which once shipped a release while CI was red. Here there is a
# single test run that the publish step depends on, so a red test can never reach
# users' auto-updater.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"

# PRs cancel superseded runs; main never cancels, so pushes serialize and two
# releases can't race to publish the same version.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/desktop

jobs:
  test:
    name: Test (swift test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test

  lint:
    name: Quality (SwiftLint)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint --reporter github-actions-logging

  # PR only: build + package the DMG (this IS the release-config build check —
  # build.sh does the arm64 release `swift build -c release`, so a separate build job
  # would just compile the same thing again on another runner) and upload it as
  # an artifact so a reviewer can install the change. No publish.
  package:
    name: Build & package DMG
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v7
      - name: Build app and installer
        run: |
          ./build.sh
          ./make-dmg.sh
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Vitals-dmg
          path: apps/desktop/build/Vitals.dmg

  # main only: build + publish the GitHub Release (version = commit count).
  # `needs: [test, lint]` gates it, and build.sh below is the release-config
  # build — if tests or lint fail, this job is skipped and nothing is built or
  # published, so users never auto-update onto a build that didn't pass. A red
  # build.sh here fails the job before `gh release create` runs, so a broken
  # compile can't publish either.
  release:
    name: Build and publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    needs: [test, lint]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — the version is the commit count

      - name: Compute version
        run: echo "VERSION=0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # Import the stable self-signed cert so this release shares one signature
      # with every prior release — users keep their TCC grants (Accessibility /
      # Microphone / Screen Recording) + Gatekeeper identity across the
      # auto-update instead of re-granting each time. Push-to-main only (this job
      # is gated to `refs/heads/main`); a fork PR never reaches here, so the
      # secret can't leak. No secret → the script warns and the build is ad-hoc.
      - name: Set up stable code-signing certificate
        env:
          MACOS_SIGN_CERT_P12: ${{ secrets.MACOS_SIGN_CERT_P12 }}
          MACOS_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/setup-signing.sh"

      - name: Build app and installer
        run: |
          export VITALS_VERSION="$VERSION"
          ./build.sh
          ./make-dmg.sh

      # The promotion commit (promote.sh) bakes the grouped-by-area PR changelog
      # into its body — and main moves ONLY via promotion, so HEAD's body IS the
      # release notes. They can't be regenerated here: after promotion main ==
      # nightly, so the "since last Stable" range no longer exists. A non-promotion
      # push has an empty body → fall back to GitHub's auto-generated notes.
      - name: Build release notes
        run: |
          notes="$RUNNER_TEMP/notes.md"
          git log -1 --format=%b HEAD > "$notes"
          if grep -q '[^[:space:]]' "$notes"; then
            prev="$(git tag -l 'v*' --sort=-v:refname | awk 'NR==1')"
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...v%s\n' \
                "$GITHUB_REPOSITORY" "$prev" "$VERSION" >> "$notes"
            fi
            echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${NOTES_FILE:-}" ]; then
            gh release create "v$VERSION" build/Vitals.dmg \
              --title "Vitals $VERSION" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "v$VERSION" build/Vitals.dmg \
              --title "Vitals $VERSION" \
              --generate-notes
          fi

      # Keep the Homebrew cask in sync automatically — the stable `vitals` cask is
      # version-pinned, so this pushes the new version + DMG sha256 to the tap so
      # nobody hand-edits it. Needs a TAP_TOKEN secret (fine-grained PAT with
      # Contents: Read & Write on rafay99-epic/homebrew-apps); skips with a
      # warning if it's absent so a missing secret never fails the release.
      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::TAP_TOKEN not set — skipping cask bump. Add a fine-grained PAT with Contents: Read & Write on rafay99-epic/homebrew-apps as the TAP_TOKEN secret to automate it."
            exit 0
          fi
          CASK=vitals bash "$GITHUB_WORKSPACE/.github/scripts/bump-cask.sh" "$PWD/build/Vitals.dmg"
# Dependency checking is handled by Dependabot (.github/dependabot.yml) and
# Dependabot security alerts — dependency-review-action needs GitHub Advanced
# Security, which isn't available on private personal repos.
