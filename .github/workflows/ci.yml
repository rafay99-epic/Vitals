name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build release
        run: swift build -c release

  package:
    name: Package DMG
    runs-on: macos-15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build app and installer
        run: |
          ./build.sh
          ./make-dmg.sh
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Vitals-dmg
          path: build/Vitals.dmg

  lint:
    name: Quality (SwiftLint)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint --reporter github-actions-logging
# Dependency checking is handled by Dependabot (.github/dependabot.yml) and
# Dependabot security alerts — dependency-review-action needs GitHub Advanced
# Security, which isn't available on private personal repos.
