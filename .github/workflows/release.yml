name: Release

# Every app change on main publishes a release (version = commit count),
# so website-only commits must not trigger a new DMG.
on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history — the version is the commit count

      - name: Compute version
        run: echo "VERSION=0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build app and installer
        run: |
          export VITALS_VERSION="$VERSION"
          ./build.sh
          ./make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/Vitals.dmg \
            --title "Vitals $VERSION" \
            --generate-notes
