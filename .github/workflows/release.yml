name: Release

# Publishes a release for every app change on main (version = commit count).
# Website-only and root-tooling commits do not cut releases.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history — the version is the commit count

      - name: Compute version
        run: echo "VERSION=0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build app and installer
        run: |
          export VITALS_VERSION="$VERSION"
          ./build.sh
          ./make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/Vitals.dmg \
            --title "Vitals $VERSION" \
            --generate-notes
