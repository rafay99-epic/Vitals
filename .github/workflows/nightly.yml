name: Nightly

# The Nightly channel's feed. Every push to the `nightly` integration branch
# builds the Nightly app and refreshes a single rolling `nightly` GitHub
# *pre-release* carrying Vitals-Nightly.dmg — the feed the Nightly app's updater
# and the Homebrew cask (rafay99-epic/apps/vitals-nightly) track. Stable (main →
# ci.yml's release job) is untouched; Dev publishes nothing.
#
# Gated by tests: a broken push publishes nothing. Publishing is guarded to the
# canonical repo so a fork's `nightly` branch can't try (and fail) to publish.
on:
  push:
    branches: [nightly]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/nightly.yml"
  workflow_dispatch:

# Read-only by default — only the publish job below is granted contents: write.
permissions:
  contents: read

# One in-flight nightly build; a newer push supersedes an older one. Run numbers
# still increase strictly, so build ordering is never disturbed.
concurrency:
  group: nightly
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/desktop

jobs:
  test:
    name: Test before nightly
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run tests
        run: swift test
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint --reporter github-actions-logging

  nightly:
    name: Build and publish Nightly pre-release
    runs-on: macos-26
    needs: test
    # Only this job writes releases (least privilege; the test job stays read-only).
    # pull-requests: read lets changelog.sh read PR titles/labels for the notes.
    permissions:
      contents: write
      pull-requests: read
    # Only the canonical repo publishes — a fork building its own `nightly`
    # branch must not push to (or fail against) these releases.
    if: github.repository == 'rafay99-epic/Vitals'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — the version is the commit count
          persist-credentials: false # we publish via gh, never git push

      - name: Compute identity
        run: |
          echo "VERSION=0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          # Monotonic CI run number — the updater orders Nightly builds by this.
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build Nightly app and installer
        run: |
          export VITALS_CHANNEL=nightly
          export VITALS_VERSION="$VERSION"
          export VITALS_BUILD="$BUILD"
          ./make-dmg.sh

      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes list what's in this Nightly beyond the last Stable release —
          # the same shared changelog.sh that feeds the Stable notes + promotion
          # PR, so they never drift. Needs origin/main; the checkout used
          # persist-credentials:false, so fetch it explicitly with the token.
          git fetch --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "+refs/heads/main:refs/remotes/origin/main" || true
          base="$(bash "$GITHUB_WORKSPACE/.github/scripts/stable-base.sh" refs/remotes/origin/main HEAD)"
          changelog="$(bash "$GITHUB_WORKSPACE/.github/scripts/changelog.sh" "$base" HEAD)"
          notes="$RUNNER_TEMP/nightly-notes.md"
          {
            echo "Nightly build from the \`nightly\` branch @ \`$SHA\` (build $BUILD, version $VERSION-nightly)."
            echo
            echo "**Install:** \`brew install --cask rafay99-epic/apps/vitals-nightly\`, or download \`Vitals-Nightly.dmg\` below and drag to Applications."
            echo
            echo "Installs as **Vitals Nightly** — separate app, settings, and icon — so it sits next to a Stable install without touching it. Nightly auto-updates from this feed."
            echo
            echo "⚠️ Unsigned pre-release build for testing. Right-click → Open the first time to get past Gatekeeper."
            echo
            echo "---"
            echo
            echo "### Changes since the last Stable release"
            echo
            echo "$changelog"
          } > "$notes"
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"

      - name: Refresh the rolling "nightly" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A single fixed `nightly` tag that always holds the newest Nightly DMG —
          # GitHub has no /latest/ URL for pre-releases, so the updater and the
          # Homebrew cask (rafay99-epic/apps/vitals-nightly) need this stable pointer.
          # The title MUST contain "build <n>" — the updater (Updater.buildNumber)
          # and the website's convex lib parse it to order builds.
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly build/Vitals-Nightly.dmg \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Vitals Nightly · build $BUILD" \
            --notes-file "$NOTES_FILE"

      # Sync the version-pinned `vitals-nightly` cask to the DMG just shipped. The
      # nightly tag is rolling, so the cask version is the monotonic build number
      # (matches the "build <n>" release title). Needs the TAP_TOKEN secret;
      # skips with a warning if absent so a missing secret never fails the build.
      - name: Bump Homebrew cask (nightly)
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::TAP_TOKEN not set — skipping nightly cask bump. Add a fine-grained PAT with Contents: Read & Write on rafay99-epic/homebrew-apps as the TAP_TOKEN secret to automate it."
            exit 0
          fi
          VERSION="$BUILD" CASK=vitals-nightly \
            bash "$GITHUB_WORKSPACE/.github/scripts/bump-cask.sh" "$PWD/build/Vitals-Nightly.dmg"
