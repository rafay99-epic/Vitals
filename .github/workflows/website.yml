name: Website

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "apps/website/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/website.yml"

jobs:
  build:
    name: Build (bun + turbo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint and build
        run: bunx turbo lint build --filter=website
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: apps/website/dist
