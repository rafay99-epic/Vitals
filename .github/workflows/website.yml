name: Website

# Steps run strictly in order and fail fast: lint -> unit tests -> build ->
# end-to-end browser checks. The site artifact is only uploaded after every
# check has passed — a broken site never produces a deployable artifact.
on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "apps/website/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/website.yml"

jobs:
  build:
    name: Lint, test, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bunx turbo lint --filter=website
      - name: Unit tests
        run: bunx turbo test --filter=website
      - name: Build
        run: bunx turbo build --filter=website
      - name: End-to-end checks (system Chrome)
        run: bunx turbo test:e2e --filter=website
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: apps/website/dist
