name: Marketing

# Steps run strictly in order and fail fast: lint -> unit tests -> build ->
# end-to-end browser checks. The site artifact is only uploaded after every
# check has passed — a broken site never produces a deployable artifact.
on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/marketing.yml"
  pull_request:
    paths:
      - "apps/marketing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/marketing.yml"

jobs:
  build:
    name: Lint, test, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm turbo lint --filter=marketing
      - name: Unit tests
        run: pnpm turbo test --filter=marketing
      - name: Build
        run: pnpm turbo build --filter=marketing
      - name: End-to-end checks (system Chrome)
        run: pnpm turbo test:e2e --filter=marketing
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: apps/marketing/dist
